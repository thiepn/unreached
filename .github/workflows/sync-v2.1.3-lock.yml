name: Sync v2.1.3 lock metadata

on:
  push:
    branches:
      - hotfix/v2.1.3-explore-methodology-layout
    paths:
      - .github/workflows/sync-v2.1.3-lock.yml

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hotfix/v2.1.3-explore-methodology-layout
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Regenerate lock metadata with npm
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git commit -m "Sync v2.1.3 package lock metadata"
          git push origin HEAD:hotfix/v2.1.3-explore-methodology-layout
