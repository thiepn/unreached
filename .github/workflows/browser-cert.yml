name: Browser Certification

on:
  pull_request:
  push:
    branches:
      - main
      - "phase/u11-release-hardening"
      - "release/**"

permissions:
  contents: read

jobs:
  browsers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build release candidate
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run desktop and mobile browser certification
        run: npm run e2e

      - name: Diagnostic PeopleGroups.org headless-browser probe
        continue-on-error: true
        if: github.event_name == 'pull_request' && (github.head_ref == 'phase/u12b-real-data-runtime' || github.head_ref == 'phase/u12c-visible-real-data' || github.head_ref == 'phase/u12d-live-mission-visualization' || github.head_ref == 'phase/u12e-live-language-resources' || github.head_ref == 'phase/u12f-editorial-context' || startsWith(github.head_ref, 'release/'))
        env:
          PEOPLEGROUPS_LIVE_CHECK: "1"
        run: npx playwright test tests/e2e/peoplegroups-live.spec.ts --project=chromium --workers=1

      - name: Explain external API certification boundary
        if: always()
        run: |
          echo "The application browser matrix remains a blocking release gate."
          echo "PeopleGroups.org corpus integrity and production-origin HTTP CORS headers are certified by the dedicated PeopleGroups Live Certification workflow; the GitHub-runner headless browser probe here is diagnostic."

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
