name: Temporary v2.1.2 Lockfile Sync

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.head_ref == 'perf/v2.1.2-loading'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Setup pinned Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Synchronize npm package identity
        run: npm version 2.1.2 --no-git-tag-version --allow-same-version

      - name: Commit generated lockfile metadata
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Sync v2.1.2 package lock metadata"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
