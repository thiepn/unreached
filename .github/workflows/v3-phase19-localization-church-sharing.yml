name: V3 Phase 19 Localization and Church Sharing

on:
  pull_request:
    branches:
      - main
      - phase/v3-phase18-guided-mission-atlas
    paths:
      - "package.json"
      - "docs/V3_PHASE19_LOCALIZATION_CHURCH_SHARING.md"
      - "docs/DATA_AND_LEGAL_POLICY.md"
      - "src/i18n/**"
      - "src/sharing/**"
      - "src/components/ChurchPrayerSharePanel.tsx"
      - "src/pages/SharedPrayerCollectionPage.tsx"
      - "src/pages/SavedPage.tsx"
      - "src/pages/AboutPage.tsx"
      - "src/app/router.ts"
      - "src/app/App.tsx"
      - "src/app/route-preload.ts"
      - "src/styles/sharing.css"
      - "src/main.tsx"
      - "scripts/v3/phase19-check.ts"
      - "tests/e2e/v3-phase19-localization-sharing.spec.ts"
      - ".github/workflows/v3-phase19-localization-church-sharing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies reproducibly
        run: npm ci --no-audit --no-fund

      - name: Verify Phase 19 localization and sharing privacy boundaries
        run: npm run v3:phase19-check

      - name: Run complete production build gate
        run: npm run build

      - name: Audit high and critical application vulnerabilities
        run: npm audit --audit-level=high

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Certify localization and church sharing on desktop and mobile
        run: npm run v3:phase19-visual

      - name: Upload Phase 19 browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unreached-v3-phase19-localization-sharing
          path: artifacts/v3-phase19
          if-no-files-found: warn
          retention-days: 30
