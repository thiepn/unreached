name: Publish Unreached release

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Deploy Unreached to GitHub Pages
    types:
      - completed

permissions:
  contents: write
  actions: read
  checks: read
  statuses: read

concurrency:
  group: unreached-release-publication
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Resolve release identity from package metadata
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release version: $version" >&2; exit 1; }
          notes="docs/releases/v${version}.md"
          test -f "$notes" || { echo "Missing release notes: $notes" >&2; exit 1; }
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
          echo "RELEASE_NOTES=$notes" >> "$GITHUB_ENV"

      - name: Install application dependencies reproducibly
        run: npm ci --no-audit --no-fund

      - name: Install Worker dependencies reproducibly
        working-directory: worker
        run: npm ci --no-audit --no-fund

      - name: Re-run final deterministic and dependency gates
        run: |
          set -euo pipefail
          test "$(node -p 'require("./package.json").version')" = "$RELEASE_VERSION"
          npm audit --audit-level=high
          (cd worker && npm audit --audit-level=high)
          npm run audit:licenses
          npm run build

      - name: Wait for exact-SHA release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const repo = process.env.GITHUB_REPOSITORY;
          const sha = process.env.RELEASE_SHA;
          const token = process.env.GH_TOKEN;
          const requiredRuns = [
            "Unreached CI",
            "Browser Certification",
            "Dependency Security and License Audit",
            "PeopleGroups Live Certification",
            "Deploy Unreached to GitHub Pages",
            "Unreached Worker Production Certification",
          ];
          const requiredStatuses = [
            "unreached/pages-production",
            "unreached/peoplegroups-live",
            "unreached/worker-production",
          ];
          const headers = {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${token}`,
            "X-GitHub-Api-Version": "2022-11-28",
          };
          async function json(url) {
            const response = await fetch(url, { headers, cache: "no-store" });
            if (!response.ok) throw new Error(`${url} returned ${response.status}: ${await response.text()}`);
            return await response.json();
          }
          for (let attempt = 1; attempt <= 80; attempt += 1) {
            const branch = await json(`https://api.github.com/repos/${repo}/branches/main`);
            if (branch.commit?.sha !== sha) throw new Error(`main moved from release candidate ${sha} to ${branch.commit?.sha}`);

            const runPayload = await json(`https://api.github.com/repos/${repo}/actions/runs?head_sha=${sha}&per_page=100`);
            const runs = Array.isArray(runPayload.workflow_runs) ? runPayload.workflow_runs : [];
            const runState = Object.fromEntries(requiredRuns.map((name) => {
              const matching = runs.filter((run) => run.name === name);
              const success = matching.some((run) => run.status === "completed" && run.conclusion === "success");
              const failed = matching.some((run) => run.status === "completed" && !["success", "skipped", "neutral"].includes(run.conclusion));
              return [name, { success, failed, matching: matching.map((run) => ({ id: run.id, status: run.status, conclusion: run.conclusion })) }];
            }));
            const failedRun = Object.entries(runState).find(([, state]) => state.failed);
            if (failedRun) throw new Error(`Required workflow failed: ${failedRun[0]} ${JSON.stringify(failedRun[1])}`);

            const statusPayload = await json(`https://api.github.com/repos/${repo}/commits/${sha}/status`);
            const statuses = Array.isArray(statusPayload.statuses) ? statusPayload.statuses : [];
            const statusState = Object.fromEntries(requiredStatuses.map((context) => {
              const latest = statuses.find((status) => status.context === context);
              return [context, latest?.state ?? "missing"];
            }));
            const failedStatus = Object.entries(statusState).find(([, state]) => state === "failure" || state === "error");
            if (failedStatus) throw new Error(`Required production status failed: ${failedStatus[0]}=${failedStatus[1]}`);

            const allRuns = Object.values(runState).every((state) => state.success);
            const allStatuses = Object.values(statusState).every((state) => state === "success");
            if (allRuns && allStatuses) {
              console.log(`Exact-SHA release evidence is green for ${sha}.`);
              console.log(JSON.stringify({ runState, statusState }, null, 2));
              process.exit(0);
            }
            console.log(`Attempt ${attempt}: waiting for release evidence`, JSON.stringify({ runState, statusState }));
            await new Promise((resolve) => setTimeout(resolve, 15_000));
          }
          throw new Error(`Timed out waiting for exact-SHA release evidence for ${sha}`);
          NODE

      - name: Record repository governance state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          protected=$(curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/main" | jq -r '.protected')
          echo "GitHub reports main.protected=${protected}."
          if [[ "$protected" != "true" ]]; then
            echo "::warning::main is not branch-protected. Release notes must disclose this repository-administration limitation; exact-SHA publication gates remain enforced."
          fi

      - name: Create immutable release tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")

          existing_ref_status=$(curl --silent --show-error -o /tmp/ref.json -w '%{http_code}' "${auth[@]}" "$api/git/ref/tags/$RELEASE_TAG")
          if [[ "$existing_ref_status" == "200" ]]; then
            existing_sha=$(jq -r '.object.sha' /tmp/ref.json)
            test "$existing_sha" = "$RELEASE_SHA" || { echo "Existing $RELEASE_TAG points to $existing_sha, not $RELEASE_SHA. Bump package.json before publishing another main SHA." >&2; exit 1; }
          elif [[ "$existing_ref_status" == "404" ]]; then
            payload=$(jq -nc --arg ref "refs/tags/$RELEASE_TAG" --arg sha "$RELEASE_SHA" '{ref:$ref,sha:$sha}')
            curl --fail-with-body --silent --show-error -X POST "${auth[@]}" -H "Content-Type: application/json" --data "$payload" "$api/git/refs" >/tmp/tag-created.json
          else
            cat /tmp/ref.json >&2
            exit 1
          fi

          existing_release_status=$(curl --silent --show-error -o /tmp/release.json -w '%{http_code}' "${auth[@]}" "$api/releases/tags/$RELEASE_TAG")
          if [[ "$existing_release_status" == "200" ]]; then
            jq -e --arg target "$RELEASE_SHA" '.target_commitish == $target and .draft == false and .prerelease == false' /tmp/release.json >/dev/null || {
              echo "Existing release $RELEASE_TAG does not match certified SHA/state." >&2
              cat /tmp/release.json >&2
              exit 1
            }
            echo "Release $RELEASE_TAG already exists and exact identity is correct."
            exit 0
          elif [[ "$existing_release_status" != "404" ]]; then
            cat /tmp/release.json >&2
            exit 1
          fi

          release_body=$(printf 'Certified release commit: `%s`.\n\n%s' "$RELEASE_SHA" "$(cat "$RELEASE_NOTES")")
          payload=$(jq -nc \
            --arg tag "$RELEASE_TAG" \
            --arg target "$RELEASE_SHA" \
            --arg name "Unreached $RELEASE_TAG" \
            --arg body "$release_body" \
            '{tag_name:$tag,target_commitish:$target,name:$name,body:$body,draft:false,prerelease:false,generate_release_notes:false}')
          curl --fail-with-body --silent --show-error -X POST "${auth[@]}" -H "Content-Type: application/json" --data "$payload" "$api/releases" | tee /tmp/release-created.json
          jq -e --arg tag "$RELEASE_TAG" --arg target "$RELEASE_SHA" '.tag_name == $tag and .target_commitish == $target and .draft == false and .prerelease == false' /tmp/release-created.json >/dev/null
