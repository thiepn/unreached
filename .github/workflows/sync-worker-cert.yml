name: Unreached Private Sync Certification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "worker/**"
      - "src/sync/**"
      - "src/pages/AccountPage.tsx"
      - "scripts/sync/**"
      - "tests/e2e/phase1-sync-hardening.spec.ts"
      - "tests/e2e/v20-private-continuity.spec.ts"
      - ".github/workflows/sync-worker-cert.yml"
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "src/sync/**"
      - "src/pages/AccountPage.tsx"
      - "scripts/sync/**"
      - "tests/e2e/phase1-sync-hardening.spec.ts"
      - "tests/e2e/v20-private-continuity.spec.ts"
      - ".github/workflows/sync-worker-cert.yml"

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci --no-audit --no-fund

      - name: Render isolated certification configuration
        working-directory: worker
        env:
          D1_DATABASE_ID: 00000000-0000-0000-0000-000000000001
          ACCESS_AUD: certification-access-audience
        run: node render-config.mjs

      - name: Validate Wrangler configuration, generated bindings and TypeScript
        working-directory: worker
        run: npm run check

      - name: Apply D1 migrations to an isolated local database
        working-directory: worker
        run: |
          rm -rf .wrangler
          npx wrangler d1 migrations apply unreached-private-continuity --local --config wrangler.generated.jsonc

      - name: Verify local hash-only identity schema
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          result=$(npx wrangler d1 execute unreached-private-continuity --local --config wrangler.generated.jsonc --json --command "SELECT (SELECT COUNT(*) FROM pragma_table_info('sync_users') WHERE name='identity_hash') AS identity_hash_columns, (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name LIKE 'sync_users_hash_only_%') AS hash_triggers, (SELECT COUNT(*) FROM sync_users WHERE email <> user_id OR identity_hash IS NULL OR identity_hash <> user_id) AS invalid_rows;")
          printf '%s' "$result" | jq -e '.[0].results[0] | .identity_hash_columns == 1 and .hash_triggers >= 2 and .invalid_rows == 0' >/dev/null

      - name: Verify deployment template remains secret-free
        run: |
          ! grep -R --line-number -E '(^|[^A-Za-z])(api[_-]?token|account[_-]?token|client[_-]?secret)[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_-]{12,}' worker --exclude='wrangler.generated.jsonc'
          grep -q '__D1_DATABASE_ID__' worker/wrangler.template.jsonc
          grep -q '__ACCESS_AUD__' worker/wrangler.template.jsonc
