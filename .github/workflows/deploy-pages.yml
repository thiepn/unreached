name: Deploy Unreached to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck, validate and build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  production-cert:
    runs-on: ubuntu-latest
    needs: deploy
    env:
      PLAYWRIGHT_BASE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Wait for deployed entry point
        shell: bash
        run: |
          set -euo pipefail
          base="${PLAYWRIGHT_BASE_URL%/}/"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --header "Cache-Control: no-cache" "${base}" | grep -q "Unreached"; then
              exit 0
            fi
            sleep 5
          done
          echo "Production entry point did not become ready: ${base}" >&2
          exit 1

      - name: Verify deployed release-policy endpoints
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = process.env.PLAYWRIGHT_BASE_URL.endsWith("/")
            ? process.env.PLAYWRIGHT_BASE_URL
            : `${process.env.PLAYWRIGHT_BASE_URL}/`;

          async function get(path) {
            const url = new URL(path, base);
            const response = await fetch(url, { cache: "no-store" });
            if (!response.ok) throw new Error(`${url} returned ${response.status}`);
            return response;
          }

          const html = await (await get("./")).text();
          if (!html.includes("Unreached")) throw new Error("Production HTML does not identify Unreached");
          if (!html.includes("/unreached/")) throw new Error("Production HTML is missing /unreached/ scoped assets");

          const manifest = await (await get("site.webmanifest")).json();
          if (manifest.name !== "Unreached — Explore. Understand. Pray.") throw new Error("Unexpected production manifest name");
          if (manifest.short_name !== "Unreached") throw new Error("Unexpected production manifest short_name");
          if (manifest.id !== "/unreached/") throw new Error("Unexpected production manifest id");
          if (manifest.scope !== "/unreached/") throw new Error("Unexpected production manifest scope");
          if (manifest.start_url !== "/unreached/#/") throw new Error("Unexpected production manifest start_url");

          const context = await (await get("data/context/status.json")).json();
          if (context.available !== true || context.fixture !== false || context.mode !== "reviewed-editorial" || context.datasetUrl !== "data/context/editorial.v2.json") {
            throw new Error("Production context status violates U12F reviewed-editorial contract");
          }
          if (!Number.isInteger(context.profileCount) || context.profileCount < 1 || context.identityProvider !== "peoplegroups-org") {
            throw new Error("Production context identity/profile metadata is invalid");
          }
          const editorial = await (await get(context.datasetUrl)).json();
          if (editorial.schemaVersion !== 2 || editorial.fixture !== false || !Array.isArray(editorial.profiles) || editorial.profiles.length !== context.profileCount) {
            throw new Error("Production editorial context dataset does not match status metadata");
          }
          for (const profile of editorial.profiles) {
            if (profile.peopleEntityId !== `people-entity:peoplegroups:${profile.peid}` || profile.identity?.targetPeid !== profile.peid || profile.identity?.numericCoincidenceUsed !== false) {
              throw new Error(`Editorial context identity contract failed for PEID ${profile.peid}`);
            }
            if (profile.review?.status !== "published" || profile.review?.checklist?.identityMatchChecked !== true) {
              throw new Error(`Editorial context review contract failed for PEID ${profile.peid}`);
            }
          }

          for (const domain of ["mission", "countries", "peoples", "prayer", "languages"]) {
            const status = await (await get(`data/${domain}/status.json`)).json();
            if (status.available !== true || status.fixture !== false || status.datasetUrl !== null || status.mode !== "runtime-api") {
              throw new Error(`Production ${domain} runtime publication status is invalid`);
            }
            if (!Array.isArray(status.sourceIds) || !status.sourceIds.includes("peoplegroups-org-api")) {
              throw new Error(`Production ${domain} status does not identify PeopleGroups.org`);
            }
          }

          const prayer = await (await get("data/prayer/status.json")).json();
          if (prayer.templateVersion !== "u12c-v1" || prayer.templateReviewedAt !== "2026-08-22") {
            throw new Error("Production prayer template certification metadata is invalid");
          }
          NODE

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser certification against deployed Pages site
        run: npm run e2e

      - name: Upload production Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: production-playwright-report
          path: playwright-report
          if-no-files-found: ignore

  report-production-status:
    runs-on: ubuntu-latest
    needs: [deploy, production-cert]
    if: always()
    permissions:
      statuses: write
    steps:
      - name: Publish production certification commit status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          CERT_RESULT: ${{ needs.production-cert.result }}
          TARGET_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          state="failure"
          description="Pages production certification failed"
          if [[ "${DEPLOY_RESULT}" == "success" && "${CERT_RESULT}" == "success" ]]; then
            state="success"
            description="Pages deployment and live browser certification passed"
          fi

          if [[ -n "${TARGET_URL}" ]]; then
            payload=$(jq -nc --arg state "${state}" --arg target "${TARGET_URL}" --arg description "${description}" '{state:$state,target_url:$target,description:$description,context:"unreached/pages-production"}')
          else
            payload=$(jq -nc --arg state "${state}" --arg description "${description}" '{state:$state,description:$description,context:"unreached/pages-production"}')
          fi

          curl --fail-with-body --silent --show-error --location \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "${payload}"
