name: PeopleGroups Live Certification

on:
  push:
    branches:
      - main
      - "phase/u12b-real-data-runtime"
      - "phase/u12c-visible-real-data"
      - "phase/u12d-live-mission-visualization"
      - "phase/u12e-live-language-resources"
      - "phase/u12f-editorial-context"
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  live-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BASE_URL: ${{ github.ref == 'refs/heads/main' && 'https://www.thiepn.dev/unreached/' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Fast editorial PEID/PGID identity preflight
        run: npm run peoplegroups:editorial-identity-live-check

      - name: Build application and runtime policy gates
        run: npm run build

      - name: Validate live corpus, HTTP CORS contract and editorial mappings
        run: npm run peoplegroups:live-corpus-check

      - name: Allow provider cooldown after full-corpus audit
        run: sleep 12

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Diagnostic headless-browser API probe
        continue-on-error: true
        env:
          PEOPLEGROUPS_LIVE_CHECK: "1"
        run: npx playwright test tests/e2e/peoplegroups-live.spec.ts --project=chromium --workers=1

      - name: Explain browser probe semantics
        if: always()
        run: |
          echo "The release gate is the validated live corpus plus the provider's HTTP CORS headers for the production origin."
          echo "The headless Chromium probe is diagnostic because PeopleGroups.org may block automated GitHub-runner browser traffic even when its API and CORS headers are valid."

  report-live-status:
    runs-on: ubuntu-latest
    needs: live-browser
    if: always()
    permissions:
      statuses: write
    steps:
      - name: Publish PeopleGroups live status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE_RESULT: ${{ needs.live-browser.result }}
        run: |
          set -euo pipefail
          state="failure"
          description="PeopleGroups.org corpus/CORS-header/editorial certification failed"
          if [[ "${LIVE_RESULT}" == "success" ]]; then
            state="success"
            description="PeopleGroups.org corpus, CORS headers and editorial PEID certification passed"
          fi
          target="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(jq -nc --arg state "${state}" --arg target "${target}" --arg description "${description}" '{state:$state,target_url:$target,description:$description,context:"unreached/peoplegroups-live"}')
          curl --fail-with-body --silent --show-error --location \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "${payload}"
