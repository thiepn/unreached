name: PeopleGroups Live Certification

on:
  push:
    branches:
      - main
      - "phase/u12b-real-data-runtime"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build application and runtime policy gates
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify browser CORS and live API contract
        env:
          PEOPLEGROUPS_LIVE_CHECK: "1"
        run: npx playwright test tests/e2e/peoplegroups-live.spec.ts --project=chromium --workers=1
