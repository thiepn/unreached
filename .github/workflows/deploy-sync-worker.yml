name: Unreached Private Sync Deployment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-sync-worker.yml"

permissions:
  contents: read

concurrency:
  group: unreached-private-sync-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: unreached-private-continuity
      D1_NAME: unreached-private-continuity
      ACCESS_APP_NAME: Unreached private continuity workers.dev
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Verify deployment credentials exist
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci --no-audit --no-fund

      - name: Create or reuse D1 database
        id: d1
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          BASE="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          LIST=$(curl --fail-with-body --silent --show-error -H "$AUTH" "$BASE")
          printf '%s' "$LIST" | jq -e '.success == true' >/dev/null
          DB_ID=$(printf '%s' "$LIST" | jq -r --arg name "$D1_NAME" '.result[]? | select(.name == $name) | (.uuid // .id)' | head -n1)
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            PAYLOAD=$(jq -n --arg name "$D1_NAME" '{name:$name}')
            CREATED=$(curl --fail-with-body --silent --show-error -X POST -H "$AUTH" -H "Content-Type: application/json" --data "$PAYLOAD" "$BASE")
            printf '%s' "$CREATED" | jq -e '.success == true' >/dev/null
            DB_ID=$(printf '%s' "$CREATED" | jq -r '.result.uuid // .result.id')
          fi
          test -n "$DB_ID" && test "$DB_ID" != "null"
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Discover workers.dev backend origin
        id: backend
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          BODY=$(curl --fail-with-body --silent --show-error -H "$AUTH" "$URL")
          printf '%s' "$BODY" | jq -e '.success == true' >/dev/null
          SUBDOMAIN=$(printf '%s' "$BODY" | jq -r '.result.subdomain')
          ENABLED=$(printf '%s' "$BODY" | jq -r '.result.enabled // true')
          test -n "$SUBDOMAIN" && test "$SUBDOMAIN" != "null"
          if [ "$ENABLED" = "false" ]; then
            UPDATED=$(curl --fail-with-body --silent --show-error -X POST -H "$AUTH" -H "Content-Type: application/json" --data '{"enabled":true}' "$URL")
            printf '%s' "$UPDATED" | jq -e '.success == true' >/dev/null
          fi
          HOST="$WORKER_NAME.$SUBDOMAIN.workers.dev"
          ORIGIN="https://$HOST"
          ACCESS_DOMAIN="$HOST/unreached-sync/private/auth/start"
          echo "workers_subdomain=$SUBDOMAIN" >> "$GITHUB_OUTPUT"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "origin=$ORIGIN" >> "$GITHUB_OUTPUT"
          echo "access_domain=$ACCESS_DOMAIN" >> "$GITHUB_OUTPUT"
          echo "Private sync backend origin: $ORIGIN"

      - name: Ensure Zero Trust organization is initialized
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/organizations"
          BODY=$(mktemp)
          STATUS=$(curl --silent --show-error -o "$BODY" -w '%{http_code}' -H "$AUTH" "$URL")
          if [ "$STATUS" = "200" ] && jq -e '.success == true' "$BODY" >/dev/null 2>&1; then
            echo "Zero Trust organization is already initialized."
            exit 0
          fi

          echo "Zero Trust organization lookup returned HTTP $STATUS. Attempting idempotent initialization."
          jq -c '{success,errors,messages}' "$BODY" 2>/dev/null || cat "$BODY"
          TEAM="unreached-${CLOUDFLARE_ACCOUNT_ID:0:8}"
          PAYLOAD=$(jq -n --arg name "$TEAM" --arg domain "$TEAM.cloudflareaccess.com" '{name:$name,auth_domain:$domain}')
          CREATE_BODY=$(mktemp)
          CREATE_STATUS=$(curl --silent --show-error -o "$CREATE_BODY" -w '%{http_code}' -X POST -H "$AUTH" -H "Content-Type: application/json" --data "$PAYLOAD" "$URL")
          if { [ "$CREATE_STATUS" = "200" ] || [ "$CREATE_STATUS" = "201" ]; } && jq -e '.success == true' "$CREATE_BODY" >/dev/null 2>&1; then
            echo "Zero Trust organization initialized."
            exit 0
          fi

          echo "Unable to initialize Zero Trust organization (HTTP $CREATE_STATUS)."
          jq -c '{success,errors,messages}' "$CREATE_BODY" 2>/dev/null || cat "$CREATE_BODY"
          exit 1

      - name: Create or reuse One-time PIN identity provider
        id: otp
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          BASE="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access"
          BODY=$(mktemp)
          STATUS=$(curl --silent --show-error -o "$BODY" -w '%{http_code}' -H "$AUTH" "$BASE/identity_providers")
          if [ "$STATUS" != "200" ] || ! jq -e '.success == true' "$BODY" >/dev/null 2>&1; then
            echo "Identity-provider lookup failed (HTTP $STATUS)."
            jq -c '{success,errors,messages}' "$BODY" 2>/dev/null || cat "$BODY"
            exit 1
          fi
          OTP_ID=$(jq -r '.result[]? | select(.type == "onetimepin") | .id' "$BODY" | head -n1)
          if [ -z "$OTP_ID" ] || [ "$OTP_ID" = "null" ]; then
            CREATE_BODY=$(mktemp)
            CREATE_STATUS=$(curl --silent --show-error -o "$CREATE_BODY" -w '%{http_code}' -X POST -H "$AUTH" -H "Content-Type: application/json" \
              --data '{"name":"Unreached email one-time PIN","type":"onetimepin","config":{}}' \
              "$BASE/identity_providers")
            if { [ "$CREATE_STATUS" != "200" ] && [ "$CREATE_STATUS" != "201" ]; } || ! jq -e '.success == true' "$CREATE_BODY" >/dev/null 2>&1; then
              echo "Identity-provider creation failed (HTTP $CREATE_STATUS)."
              jq -c '{success,errors,messages}' "$CREATE_BODY" 2>/dev/null || cat "$CREATE_BODY"
              exit 1
            fi
            OTP_ID=$(jq -r '.result.id' "$CREATE_BODY")
          fi
          test -n "$OTP_ID" && test "$OTP_ID" != "null"
          echo "otp_id=$OTP_ID" >> "$GITHUB_OUTPUT"

      - name: Create or reuse Access application
        id: access
        env:
          OTP_ID: ${{ steps.otp.outputs.otp_id }}
          ACCESS_DOMAIN: ${{ steps.backend.outputs.access_domain }}
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          BASE="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access"
          BODY=$(mktemp)
          STATUS=$(curl --silent --show-error -o "$BODY" -w '%{http_code}' -H "$AUTH" "$BASE/apps")
          if [ "$STATUS" != "200" ] || ! jq -e '.success == true' "$BODY" >/dev/null 2>&1; then
            echo "Access-app lookup failed (HTTP $STATUS)."
            jq -c '{success,errors,messages}' "$BODY" 2>/dev/null || cat "$BODY"
            exit 1
          fi
          APP_ID=$(jq -r --arg name "$ACCESS_APP_NAME" '.result[]? | select(.name == $name) | .id' "$BODY" | head -n1)
          AUD=$(jq -r --arg name "$ACCESS_APP_NAME" '.result[]? | select(.name == $name) | .aud' "$BODY" | head -n1)
          if [ -z "$APP_ID" ] || [ "$APP_ID" = "null" ]; then
            PAYLOAD=$(jq -n \
              --arg name "$ACCESS_APP_NAME" \
              --arg domain "$ACCESS_DOMAIN" \
              --arg otp "$OTP_ID" \
              '{type:"self_hosted",name:$name,domain:$domain,session_duration:"720h",allowed_idps:[$otp],auto_redirect_to_identity:true,app_launcher_visible:false,policies:[{name:"Authenticated email account",decision:"allow",include:[{login_method:{id:$otp}}]}]}')
            CREATE_BODY=$(mktemp)
            CREATE_STATUS=$(curl --silent --show-error -o "$CREATE_BODY" -w '%{http_code}' -X POST -H "$AUTH" -H "Content-Type: application/json" --data "$PAYLOAD" "$BASE/apps")
            if { [ "$CREATE_STATUS" != "200" ] && [ "$CREATE_STATUS" != "201" ]; } || ! jq -e '.success == true' "$CREATE_BODY" >/dev/null 2>&1; then
              echo "Access-app creation failed (HTTP $CREATE_STATUS)."
              jq -c '{success,errors,messages}' "$CREATE_BODY" 2>/dev/null || cat "$CREATE_BODY"
              exit 1
            fi
            APP_ID=$(jq -r '.result.id' "$CREATE_BODY")
            AUD=$(jq -r '.result.aud' "$CREATE_BODY")
          fi
          test -n "$APP_ID" && test "$APP_ID" != "null"
          test -n "$AUD" && test "$AUD" != "null"
          echo "aud=$AUD" >> "$GITHUB_OUTPUT"

      - name: Render production Wrangler configuration
        working-directory: worker
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
          ACCESS_AUD: ${{ steps.access.outputs.aud }}
        run: node render-config.mjs

      - name: Generate binding types and typecheck Worker
        working-directory: worker
        run: npm run check

      - name: Capture pre-migration D1 Time Travel bookmark
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../.recovery
          npx wrangler d1 time-travel info "$D1_NAME" --config wrangler.generated.jsonc | tee ../.recovery/d1-pre-migration.txt

      - name: Upload pre-migration recovery reference
        uses: actions/upload-artifact@v7
        with:
          name: d1-pre-migration-bookmark
          path: .recovery/d1-pre-migration.txt
          retention-days: 30

      - name: Apply D1 migrations
        working-directory: worker
        run: npx wrangler d1 migrations apply "$D1_NAME" --remote --config wrangler.generated.jsonc

      - name: Verify remote hash-only identity invariant
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          result=$(npx wrangler d1 execute "$D1_NAME" --remote --config wrangler.generated.jsonc --json --command "SELECT (SELECT COUNT(*) FROM pragma_table_info('sync_users') WHERE name='identity_hash') AS identity_hash_columns, (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name LIKE 'sync_users_hash_only_%') AS hash_triggers, (SELECT COUNT(*) FROM sync_users WHERE email <> user_id OR identity_hash IS NULL OR identity_hash <> user_id) AS invalid_rows;")
          printf '%s' "$result" | jq -e '.[0].results[0] | .identity_hash_columns == 1 and .hash_triggers >= 2 and .invalid_rows == 0' >/dev/null

      - name: Deploy private sync Worker
        working-directory: worker
        run: npm run deploy

      - name: Verify public health endpoint
        env:
          BACKEND_ORIGIN: ${{ steps.backend.outputs.origin }}
        run: |
          RESPONSE=$(curl --fail-with-body --silent --show-error --retry 5 --retry-delay 2 "$BACKEND_ORIGIN/unreached-sync/health")
          printf '%s' "$RESPONSE" | jq -e '.ok == true and .version == "2.0.0"' >/dev/null
          echo "$RESPONSE"

      - name: Verify Access protects sign-in bootstrap
        env:
          BACKEND_ORIGIN: ${{ steps.backend.outputs.origin }}
        shell: bash
        run: |
          set -euo pipefail
          body=$(mktemp)
          STATUS=$(curl --silent --show-error -o "$body" -w '%{http_code}' "$BACKEND_ORIGIN/unreached-sync/private/auth/start?returnOrigin=https%3A%2F%2Fwww.thiepn.dev")
          case "$STATUS" in
            200|301|302|303|307|308|401|403) ;;
            *) echo "Unexpected sign-in bootstrap status: $STATUS"; cat "$body"; exit 1 ;;
          esac
          if [[ "$STATUS" == "200" ]] && grep -q "Sign-in complete. You can return to Unreached." "$body"; then
            echo "Authenticated completion page was anonymously reachable." >&2
            exit 1
          fi
          echo "Unauthenticated sign-in bootstrap returned HTTP $STATUS without exposing the authenticated completion page."
