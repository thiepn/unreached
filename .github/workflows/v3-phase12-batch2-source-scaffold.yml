name: V3 Phase 12 Batch 2 Source Scaffold
# Rerun after September 2026 provider-schema adapter

on:
  push:
    branches:
      - phase/v3-phase12-content-certification
    paths:
      - ".github/workflows/v3-phase12-batch2-source-scaffold.yml"
      - "scripts/v3/phase12-editorial-scaffold-batch.ts"

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies reproducibly
        run: npm ci --no-audit --no-fund

      - name: Capture raw Batch 2 provider responses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/v3-phase12/batch2-raw
          for pgid in PG012316 PG012320 PG012325 PG012297; do
            curl --fail --silent --show-error --location \
              -H 'Accept: application/json' \
              "https://peoplegroups.org/wp-json/pg/v1/people-groups/${pgid}" \
              -o "artifacts/v3-phase12/batch2-raw/${pgid}.json"
          done
          node --input-type=module <<'NODE'
          import { readFile, readdir } from 'node:fs/promises';
          for (const name of (await readdir('artifacts/v3-phase12/batch2-raw')).sort()) {
            const raw = await readFile('artifacts/v3-phase12/batch2-raw/' + name, 'utf8');
            const value = JSON.parse(raw);
            const record = Array.isArray(value) ? value[0] : value;
            console.log(JSON.stringify({
              file: name,
              topLevel: Array.isArray(value) ? 'array' : typeof value,
              arrayLength: Array.isArray(value) ? value.length : null,
              keys: record && typeof record === 'object' ? Object.keys(record).sort() : [],
              core: record && typeof record === 'object' ? {
                PEID: record.PEID, PGID: record.PGID, NmDisp: record.NmDisp,
                ISOalpha3: record.ISOalpha3, Ctry: record.Ctry, ROL: record.ROL,
                GSEC: record.GSEC, UpdatedDate: record.UpdatedDate
              } : null
            }, null, 2));
          }
          NODE
      - name: Fetch verified Batch 2 source identities
        id: batch_scaffold
        continue-on-error: true
        run: npm run v3:phase12-editorial-scaffold-batch -- --pgids=PG012316,PG012320,PG012325,PG012297

      - name: Print machine-readable identity index
        if: always()
        run: cat artifacts/v3-phase12/workbench/batch-scaffold-index.json

      - name: Upload private Batch 2 research scaffolds
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unreached-v3-phase12-batch2-source-scaffolds
          path: |
            artifacts/v3-phase12/workbench
            artifacts/v3-phase12/batch2-raw
          if-no-files-found: error
          retention-days: 30

      - name: Fail if no Batch 2 source identities were prepared
        if: steps.batch_scaffold.outcome != 'success'
        run: exit 1
