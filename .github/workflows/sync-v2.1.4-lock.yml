name: Sync v2.1.4 lock metadata

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-lock:
    if: github.head_ref == 'chatgpt/v2.1.4-comprehension-release'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Setup pinned Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Synchronize package-lock metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit synchronized lockfile when needed
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Sync package lock for v2.1.4"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
