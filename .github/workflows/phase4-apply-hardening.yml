name: Phase 4 Apply Hardening

on:
  push:
    branches:
      - phase/phase4-repro-security-operations

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase/phase4-repro-security-operations
          fetch-depth: 0

      - name: Apply permanent Phase 4 changes
        run: python3 scripts/operations/apply-phase4-hardening.py

      - name: Commit Phase 4 changes
        shell: bash
        run: |
          set -euo pipefail
          git add package.json .gitignore index.html public/privacy.html PRIVACY.md docs worker scripts .github/workflows
          git reset .github/workflows/phase4-apply-hardening.yml scripts/operations/apply-phase4-hardening.py
          if git diff --cached --quiet; then
            echo "Permanent Phase 4 changes are already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: implement Phase 4 release hardening"
          git push origin HEAD:phase/phase4-repro-security-operations
