name: V3 Phase 1 Source Architecture

on:
  pull_request:
    branches:
      - main
      - phase/v3-phase0-product-reset
    paths:
      - "docs/V3_PHASE1_SOURCE_ARCHITECTURE.md"
      - "data/source-registry.json"
      - "src/mission/**"
      - "src/providers/peoplegroups/classification.ts"
      - "src/providers/peoplegroups/model.ts"
      - "src/providers/peoplegroups/types.ts"
      - "scripts/v3/phase1-check.ts"
      - "scripts/release/check.ts"
      - "package.json"
      - ".github/workflows/v3-phase1-source-architecture.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-architecture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Phase 1 source architecture
        run: npm run v3:phase1-check

      - name: Typecheck
        run: npm run typecheck

      - name: Build with source-policy gates
        run: npm run build
