name: V3 Phase 12 Content and Unreached 3.0 Certification

on:
  pull_request:
    branches:
      - main
      - phase/v3-phase11-personal-memory
    paths:
      - "package.json"
      - "package-lock.json"
      - "docs/V3_PHASE12_CONTENT_CERTIFICATION.md"
      - "docs/V3_PHASE12_EDITORIAL_WORKBENCH.md"
      - "data/v3/editorial/candidates/**"
      - "public/data/context/**"
      - "src/context/**"
      - "src/editorial/**"
      - "src/map/WorldMap.tsx"
      - "src/pages/ExplorePage.tsx"
      - "src/styles/atlas-foundation/**"
      - "scripts/v3/phase12-*.ts"
      - "tests/e2e/phase10-explore-map.spec.ts"
      - "tests/e2e/v3-phase12-certification.spec.ts"
      - ".github/workflows/v3-phase12-content-certification.yml"
  workflow_dispatch:
    inputs:
      strict:
        description: "Run the strict >=100 reviewed-profile Unreached 3.0 release gate"
        required: false
        default: false
        type: boolean
      generate_editorial_queue:
        description: "Generate a private non-ranking editorial research queue artifact from the live PeopleGroups API"
        required: false
        default: false
        type: boolean
      editorial_pgid:
        description: "Optional PGID (for example PG012345) to generate a private Phase 12 research/review scaffold artifact"
        required: false
        default: ""
        type: string
      editorial_pgids:
        description: "Optional comma-separated PGIDs (1-25) to generate private non-ranking Phase 12 research scaffolds"
        required: false
        default: ""
        type: string
      editorial_candidate:
        description: "Optional candidate filename to generate a live identity-checked maintainer review packet"
        required: false
        default: ""
        type: string
      review_editorial_workbench:
        description: "Generate one non-mutating live review packet for every current Phase 12 draft candidate"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  automated-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies reproducibly
        run: npm ci --no-audit --no-fund

      - name: Verify Phase 12 candidate workbench integrity
        run: npm run v3:phase12-candidate-check

      - name: Diagnostic live candidate identity and GSEC-scope audit
        id: live_candidate_audit
        continue-on-error: true
        run: npm run v3:phase12-live-candidate-audit

      - name: Surface live candidate diagnostic in job summary
        if: always()
        run: |
          if [ -f artifacts/v3-phase12/live-candidate-audit.md ]; then
            cat artifacts/v3-phase12/live-candidate-audit.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate maintainer-ready workbench review packet
        if: steps.live_candidate_audit.outcome == 'success'
        continue-on-error: true
        run: npm run v3:phase12-review-workbench

      - name: Verify Phase 12 automated readiness and editorial integrity
        run: npm run v3:phase12-readiness

      - name: Audit high and critical application vulnerabilities
        run: npm audit --audit-level=high

      - name: Typecheck and run the complete production build gate
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Certify integrated Unreached 3.0 desktop and mobile journeys
        run: npm run v3:phase12-visual

      - name: Upload Phase 12 readiness and visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unreached-v3-phase12-readiness
          path: artifacts/v3-phase12
          if-no-files-found: error
          retention-days: 30

  strict-editorial-certification:
    if: github.event_name == 'workflow_dispatch' && inputs.strict == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies reproducibly
        run: npm ci --no-audit --no-fund

      - name: Enforce the 100 substantial reviewed-profile release threshold
        run: npm run v3:phase12-certify

  editorial-coverage-queue:
    if: github.event_name == 'workflow_dispatch' && inputs.generate_editorial_queue == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies reproducibly
        run: npm ci --no-audit --no-fund

      - name: Generate non-ranking editorial research queue
        run: npm run v3:phase12-editorial-queue -- --count=120

      - name: Upload private editorial queue artifact
        uses: actions/upload-artifact@v7
        with:
          name: unreached-v3-phase12-editorial-coverage-queue
          path: artifacts/v3-phase12/editorial-coverage-queue.json
          if-no-files-found: error
          retention-days: 30

  editorial-review-scaffold:
    if: github.event_name == 'workflow_dispatch' && inputs.editorial_pgid != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies reproducibly
        run: npm ci --no-audit --no-fund

      - name: Generate source-grounded research scaffold
        env:
          EDITORIAL_PGID: ${{ inputs.editorial_pgid }}
        run: npm run v3:phase12-editorial-scaffold -- --pgid="$EDITORIAL_PGID"

      - name: Upload private review scaffold artifact
        uses: actions/upload-artifact@v7
        with:
          name: unreached-v3-phase12-editorial-scaffold-${{ inputs.editorial_pgid }}
          path: artifacts/v3-phase12/workbench
          if-no-files-found: error
          retention-days: 30


  editorial-batch-scaffold:
    if: github.event_name == 'workflow_dispatch' && inputs.editorial_pgids != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies reproducibly
        run: npm ci --no-audit --no-fund

      - name: Generate non-ranking batch research scaffolds
        env:
          EDITORIAL_PGIDS: ${{ inputs.editorial_pgids }}
        run: npm run v3:phase12-editorial-scaffold-batch -- --pgids="$EDITORIAL_PGIDS"

      - name: Upload private batch research scaffolds
        uses: actions/upload-artifact@v7
        with:
          name: unreached-v3-phase12-batch-scaffolds
          path: artifacts/v3-phase12/workbench
          if-no-files-found: error
          retention-days: 30

  editorial-candidate-review:
    if: github.event_name == 'workflow_dispatch' && inputs.editorial_candidate != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies reproducibly
        run: npm ci --no-audit --no-fund

      - name: Prepare live identity-checked maintainer review packet
        env:
          EDITORIAL_CANDIDATE: ${{ inputs.editorial_candidate }}
        run: npm run v3:phase12-review-candidate -- --candidate="$EDITORIAL_CANDIDATE"

      - name: Upload private maintainer review packet
        uses: actions/upload-artifact@v7
        with:
          name: unreached-v3-phase12-review
          path: artifacts/v3-phase12/reviews
          if-no-files-found: error
          retention-days: 30

  editorial-workbench-review:
    if: github.event_name == 'workflow_dispatch' && inputs.review_editorial_workbench == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies reproducibly
        run: npm ci --no-audit --no-fund

      - name: Prepare live identity-checked workbench review packet
        run: npm run v3:phase12-review-workbench

      - name: Upload private workbench review packet
        uses: actions/upload-artifact@v7
        with:
          name: unreached-v3-phase12-workbench-review
          path: artifacts/v3-phase12/reviews
          if-no-files-found: error
          retention-days: 30
