name: V3 Phase 9 Search Discovery

on:
  pull_request:
    branches:
      - main
      - phase/v3-phase8-people-profile
    paths:
      - "docs/V3_PHASE9_SEARCH_DISCOVERY_COLLECTIONS.md"
      - "src/app/App.tsx"
      - "src/app/router.ts"
      - "src/app/route-preload.ts"
      - "src/components/AppShell.tsx"
      - "src/components/SearchDialog.tsx"
      - "src/discovery/**"
      - "src/pages/PeoplesPage.tsx"
      - "src/pages/SearchPage.tsx"
      - "src/styles/atlas-foundation/discovery.css"
      - "src/main.tsx"
      - "scripts/v3/phase4-check.ts"
      - "scripts/v3/phase9-check.ts"
      - "tests/e2e/v3-phase9-search-discovery.spec.ts"
      - "package.json"
      - ".github/workflows/v3-phase9-search-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search-discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Phase 9 discovery contract
        run: npm run v3:phase9-check

      - name: Typecheck
        run: npm run typecheck

      - name: Build with Phase 1 through Phase 9 gates
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Certify Search, Peoples and guided collections
        run: npm run v3:phase9-discovery-visual

      - name: Upload Phase 9 visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unreached-v3-phase9-search-discovery
          path: artifacts/v3-phase9
          if-no-files-found: error
          retention-days: 30
