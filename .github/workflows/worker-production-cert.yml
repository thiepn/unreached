name: Unreached Worker Production Certification

on:
  workflow_dispatch:
  push:
    branches: [main]
  workflow_run:
    workflows:
      - Unreached Private Sync Deployment
    types:
      - completed

permissions:
  contents: read
  statuses: write

jobs:
  production-worker:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Verify deployed Worker health and security headers
        shell: bash
        run: |
          set -euo pipefail
          origin="https://unreached-private-continuity.thiepn.workers.dev"
          headers=$(mktemp)
          body=$(mktemp)
          curl --fail-with-body --silent --show-error --retry 5 --retry-delay 2 \
            --dump-header "$headers" --output "$body" \
            "$origin/unreached-sync/health"
          jq -e '.ok == true and .service == "unreached-private-continuity" and .version == "2.0.0"' "$body" >/dev/null
          normalized=$(mktemp)
          tr -d '\r' < "$headers" | tr '[:upper:]' '[:lower:]' > "$normalized"
          grep -Eq '^cache-control:[[:space:]]*no-store' "$normalized"
          grep -Eq '^content-security-policy:[[:space:]]*default-src '\''none'\''' "$normalized"
          grep -Eq '^referrer-policy:[[:space:]]*no-referrer' "$normalized"
          grep -Eq '^x-content-type-options:[[:space:]]*nosniff' "$normalized"
          grep -Eq '^x-frame-options:[[:space:]]*deny' "$normalized"
          grep -Eq '^permissions-policy:[[:space:]]*camera=\(\), microphone=\(\), geolocation=\(\), payment=\(\), usb=\(\)' "$normalized"

      - name: Verify production-origin CORS contract
        shell: bash
        run: |
          set -euo pipefail
          origin="https://unreached-private-continuity.thiepn.workers.dev"
          headers=$(mktemp)
          curl --silent --show-error --output /dev/null --dump-header "$headers" \
            --request OPTIONS \
            --header "Origin: https://www.thiepn.dev" \
            --header "Access-Control-Request-Method: GET" \
            --header "Access-Control-Request-Headers: Authorization, Content-Type" \
            "$origin/unreached-sync/private/state"
          normalized=$(mktemp)
          tr -d '\r' < "$headers" | tr '[:upper:]' '[:lower:]' > "$normalized"
          grep -Eq '^http/[^ ]+[[:space:]]+204' "$normalized"
          grep -Eq '^access-control-allow-origin:[[:space:]]*https://www\.thiepn\.dev[[:space:]]*$' "$normalized"
          grep -Eq '^access-control-allow-methods:.*get.*post.*delete.*options' "$normalized"
          grep -Eq '^access-control-allow-headers:.*authorization.*content-type' "$normalized"
          ! grep -Eq '^access-control-allow-credentials:[[:space:]]*true' "$normalized"

      - name: Verify Access bootstrap is not anonymously usable
        shell: bash
        run: |
          set -euo pipefail
          url="https://unreached-private-continuity.thiepn.workers.dev/unreached-sync/private/auth/start?returnOrigin=https%3A%2F%2Fwww.thiepn.dev"
          body=$(mktemp)
          status=$(curl --silent --show-error --output "$body" --write-out '%{http_code}' "$url")
          case "$status" in
            200|301|302|303|307|308|401|403) ;;
            *) echo "Unexpected auth bootstrap HTTP status: $status"; cat "$body"; exit 1 ;;
          esac
          if [[ "$status" == "200" ]] && grep -q "Sign-in complete. You can return to Unreached." "$body"; then
            echo "Authenticated completion page was anonymously reachable." >&2
            exit 1
          fi

  report-status:
    runs-on: ubuntu-24.04
    needs: production-worker
    if: always()
    permissions:
      statuses: write
    steps:
      - name: Publish Worker production certification status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKER_RESULT: ${{ needs.production-worker.result }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          target_sha="$GITHUB_SHA"
          if [[ "$EVENT_NAME" == "workflow_run" && -n "${WORKFLOW_RUN_SHA:-}" ]]; then
            target_sha="$WORKFLOW_RUN_SHA"
          fi
          state="failure"
          description="Deployed private-sync Worker production certification failed"
          if [[ "$WORKER_RESULT" == "success" ]]; then
            state="success"
            description="Worker health, security headers, CORS and Access protection passed"
          fi
          target="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(jq -nc --arg state "$state" --arg target "$target" --arg description "$description" '{state:$state,target_url:$target,description:$description,context:"unreached/worker-production"}')
          curl --fail-with-body --silent --show-error --location \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${target_sha}" \
            --data "$payload"
